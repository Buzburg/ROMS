# Drop-in Hyprland keybindings & layer rules for Omarchy OS Studio
# Source in ~/.config/hypr/hyprland.conf:
#   source = ~/.config/omarchy/hyprland-omarchy.conf

# Global Super+Space floating prompt & Studio launcher
bind = $mainMod, SPACE, exec, alacritty --class omarchy-floating -t "ROMS Status" -e omarchy-menu

# Floating blurred glassmorphism window rules (Impeccable Design standard)
windowrulev2 = float, class:^(omarchy-floating)$
windowrulev2 = size 860 540, class:^(omarchy-floating)$
windowrulev2 = center, class:^(omarchy-floating)$
windowrulev2 = opacity 0.94 0.90, class:^(omarchy-floating)$
