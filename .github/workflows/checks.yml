name: Offline release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the no-install first run
        run: python -I -S -B scripts/demo_first_run.py
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify the portable harness with a temporary knowledge index
        run: python -B scripts/demo_harness.py
        env:
          HF_HUB_OFFLINE: '1'
      - run: python -m pytest tests/test_first_run_demo.py tests/test_prefrontal_integration.py tests/test_decisions_jev_laya.py tests/test_decision_boundaries.py tests/test_harness.py tests/test_harness_cli.py tests/test_retrieval_quality.py tests/test_experiment_claims.py -q
        env:
          HF_HUB_OFFLINE: '1'
      - run: python -m pytest tests/test_release_safety.py tests/test_memory.py tests/test_context.py tests/test_gateway_privacy.py tests/test_doctor.py tests/test_workbench_package.py tests/test_os_model.py tests/test_os_workshop.py tests/test_voice_audio.py tests/test_voice_chat.py tests/test_voice_stt.py tests/test_voice_tts.py tests/test_voice_workshop.py -q
        env:
          HF_HUB_OFFLINE: '1'
