<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title description">
  <title id="title">ROMS: prepare work for review</title>
  <desc id="description">A goal and evidence pass through indexed knowledge and selected skills to the Decision Maker. The result is a proposal or abstention. Operator approval and execution are separate.</desc>
  <rect width="960" height="390" rx="20" fill="#0d1726"/>
  <g font-family="system-ui, sans-serif" fill="#eef4fc">
    <text x="40" y="60" font-size="30" font-weight="700">ROMS</text>
    <text x="40" y="95" font-size="18" fill="#b9c9dc">Decisions, knowledge and reusable workflows</text>
    <g fill="#192b42" stroke="#42617f">
      <rect x="40" y="133" width="190" height="98" rx="12"/>
      <rect x="270" y="133" width="190" height="98" rx="12"/>
      <rect x="500" y="133" width="190" height="98" rx="12"/>
      <rect x="730" y="133" width="190" height="98" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="135" y="170">Goal + evidence</text>
      <text x="365" y="170">RAG + OKF + Skills</text>
      <text x="595" y="170">Decision Maker</text>
      <text x="825" y="170">Reviewable result</text>
    </g>
    <g text-anchor="middle" font-size="14" fill="#b9c9dc">
      <text x="135" y="201">Supplied options</text>
      <text x="365" y="201">Bounded context</text>
      <text x="595" y="201">Heuristic advice</text>
      <text x="825" y="201">Proposal or abstention</text>
    </g>
    <g fill="none" stroke="#63d5bd" stroke-width="2">
      <path d="M238 181h24m-7-6 7 6-7 6M468 181h24m-7-6 7 6-7 6M698 181h24m-7-6 7 6-7 6"/>
    </g>
    <text x="40" y="285" font-size="17" fill="#63d5bd">One preparation API through Python, CLI and MCP</text>
    <text x="40" y="322" font-size="16" fill="#b9c9dc">Approval and execution stay with the operator or configured workshop.</text>
    <text x="40" y="350" font-size="14" fill="#b9c9dc">Portable Python preparation. Optional Linux / Omarchy integration.</text>
  </g>
</svg>
